name: Deploy MySQL 8

on:
  workflow_dispatch:

jobs:
  deploy-mysql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload MySQL script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "deploy/install_mysql80.sh"
          target: "/myl/mysql"

      - name: Deploy MySQL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            chmod +x /myl/mysql/deploy/install_mysql80.sh

            export MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'
            export MYSQL_DATABASE='${{ secrets.MYSQL_DATABASE }}'
            export MYSQL_USER='${{ secrets.MYSQL_USER }}'
            export MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD }}'

            /myl/mysql/deploy/install_mysql80.sh

            mysql --version

            if ! systemctl is-active --quiet mysqld; then
              echo "MySQL 服务启动失败"

              systemctl status mysqld --no-pager || true
              journalctl -u mysqld -n 100 --no-pager || true

              exit 1
            fi

            echo "MySQL 部署成功"

      - name: Notify Feishu MySQL success
        if: success()
        run: |
          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d '{
            "msg_type": "text",
            "content": {
              "text": "✅ MySQL 部署成功\n项目：MYL9019/py\n服务：MySQL 8.0\n服务器：${{ secrets.SERVER_HOST }}\n目录：/myl/mysql"
            }
          }'

      - name: Notify Feishu MySQL failure
        if: failure()
        run: |
          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d '{
            "msg_type": "text",
            "content": {
              "text": "🚨 MySQL 部署失败\n项目：MYL9019/py\n服务：MySQL 8.0\n服务器：${{ secrets.SERVER_HOST }}\n请查看 GitHub Actions 日志"
            }
          }'