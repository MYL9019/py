name: Auto Deploy Python

on:
  push:
    branches:
      - main
    paths:
      - "services/python/**"
      - ".github/workflows/deploy-python.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Upload Python files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "services/python/*"
          target: "/myl/py"
          strip_components: 2

      - name: Deploy Python to AWS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /myl/py

            if [ -f requirements.txt ]; then
              python3 -m pip install -r requirements.txt
            fi

            systemctl restart py-zidonghua

            sleep 8

            if ! systemctl is-active --quiet py-zidonghua; then
              systemctl status py-zidonghua --no-pager || true
              journalctl -u py-zidonghua -n 100 --no-pager || true
              exit 1
            fi

            echo "Python 服务部署成功"

      - name: Notify Feishu Python success
        if: success()
        run: |
          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d '{
            "msg_type": "text",
            "content": {
              "text": "✅ Python 部署成功\n项目：MYL9019/py\n服务：py-zidonghua\n服务器：${{ secrets.SERVER_HOST }}\n目录：/myl/py\n分支：main"
            }
          }'

      - name: Notify Feishu Python failure
        if: failure()
        run: |
          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d '{
            "msg_type": "text",
            "content": {
              "text": "🚨 Python 部署失败\n项目：MYL9019/py\n服务：py-zidonghua\n服务器：${{ secrets.SERVER_HOST }}\n目录：/myl/py\n分支：main\n请查看 GitHub Actions 日志"
            }
          }'